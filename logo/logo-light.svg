<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 72" width="756" height="216">
  <title>Remates iSTORE</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;800&amp;display=swap');
    .t{font-family:Sora,'Segoe UI',Arial,sans-serif}</style>
  <defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
  <g transform="translate(2 4)">
<defs>
    <linearGradient id="rg" x1="8" y1="6" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset=".5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- la "i" se recorta de la etiqueta: el orificio es el punto y la barra es el cuerpo -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="21.5" r="4.6" fill="#000"/>
      <rect x="27.6" y="30.5" width="8.8" height="20" rx="4.4" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#cut)" transform="rotate(-8 32 34)">
    <path d="M32 6 L50 20 V51 a7 7 0 0 1 -7 7 H21 a7 7 0 0 1 -7 -7 V20 Z" fill="url(#rg)" stroke="url(#rg)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M32 6 L50 20 V51 a7 7 0 0 1 -7 7 H21 a7 7 0 0 1 -7 -7 V20 Z" fill="url(#shine)"/>
  </g>
  <!-- destello de oferta -->
  <path d="M53.5 6.5 l1.6 4.2 4.2 1.6 -4.2 1.6 -1.6 4.2 -1.6 -4.2 -4.2 -1.6 4.2 -1.6 Z" fill="#c6ff3d"/>
  </g>
  <text class="t" x="80" y="29" font-size="12.5" font-weight="600" letter-spacing="5.2" fill="#6a6a7e">REMATES</text>
  <text class="t" x="78" y="62" font-size="36" font-weight="800" letter-spacing="-1.4" fill="#0b0b12"><tspan fill="url(#tg)">i</tspan>STORE</text>
</svg>